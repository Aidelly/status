owner: Aidelly
repo: status

# ---------------------------------------------------------------------------
# What we monitor, and what each check actually proves.
#
# Aidelly's own services are probed through purpose-built endpoints that
# disclose nothing but a status word. Platform APIs are probed at their real
# API hosts, with the status code each returns when healthy: an unauthenticated
# request to a working API answers 400/401/403 deterministically, so a 5xx or a
# timeout is a genuine signal. See the caveat in introMessage: these detect
# hard outages, not partial degradation.
# ---------------------------------------------------------------------------

sites:
  # --- Aidelly services. These carry the Agency SLA. ---
  - name: App and dashboard
    url: https://app.aidelly.ai/api/health
    # Proves the app answers and the database is reachable.

  - name: Publishing
    url: https://app.aidelly.ai/api/health/publishing
    # Proves scheduled posts that are due have actually gone out.
    # 503 here means an overdue backlog, not that the app is down.

  - name: Public API
    url: https://app.aidelly.ai/api/public/v1/posts
    expectedStatusCodes:
      - 401
    # 401 is the healthy answer: the route is up and auth is enforced.

  - name: MCP server
    url: https://app.aidelly.ai/api/mcp
    expectedStatusCodes:
      - 401

  # --- Platform APIs. Displayed for transparency; NOT covered by SLA credits. ---
  - name: Instagram and Facebook
    url: https://graph.facebook.com/v21.0/me
    expectedStatusCodes:
      - 400

  - name: Threads
    url: https://graph.threads.net/v1.0/me
    expectedStatusCodes:
      - 400

  - name: LinkedIn
    url: https://api.linkedin.com/v2/me
    expectedStatusCodes:
      - 401

  - name: X
    url: https://api.twitter.com/2/users/me
    expectedStatusCodes:
      - 401

  - name: TikTok
    url: https://open.tiktokapis.com/v2/user/info/
    expectedStatusCodes:
      - 401

  - name: YouTube
    url: https://www.googleapis.com/youtube/v3/channels
    expectedStatusCodes:
      - 403

  - name: Pinterest
    url: https://api.pinterest.com/v5/user_account
    expectedStatusCodes:
      - 401

  - name: Google Business Profile
    url: https://mybusinessaccountmanagement.googleapis.com/v1/accounts
    expectedStatusCodes:
      - 401

  - name: Bluesky
    url: https://bsky.social/xrpc/com.atproto.server.describeServer

  - name: Mastodon
    url: https://mastodon.social/api/v1/instance

status-website:
  cname: status.aidelly.ai
  name: Aidelly Status
  logoUrl: https://www.aidelly.ai/logos/aidelly-mint-transparent.png
  favicon: https://www.aidelly.ai/favicon.ico

  # Plus Jakarta Sans stands in for the landing site's Satoshi and General
  # Sans. Those are next/font/local files served from hashed, unstable paths
  # with no CORS, so they cannot be reused here. This is the closest free
  # equivalent, and a near match beats a hotlink that breaks on every deploy.
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: preconnect
      href: https://fonts.gstatic.com
      crossorigin: true
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap

  # Aidelly palette, from landing/tailwind.config.ts and
  # src/lib/branding/defaults.ts. Mint (#89E9D9) is signal and decoration
  # only: at 2.1:1 on white it fails WCAG AA, so every text and button use
  # takes mint-deep (#0F7A67) instead, matching the landing site's own rule.
  #
  # Up/down/degraded keep their conventional green, red and amber. Semantic
  # status colour is not brand colour: a viewer must read "down" instantly
  # without learning our palette first.
  css: |
    :root {
      --body-background-color: #F5FAF9;
      --body-text-color: #0F2926;
      --card-background-color: #FFFFFF;
      --card-border-color: #E1EDEA;
      --nav-background-color: #FFFFFF;
      --nav-border-bottom-color: #D5F9F1;
      --nav-current-border-bottom-color: #0F7A67;
      --submit-button-background-color: #0F7A67;
      --submit-button-border-color: #0C6154;
      --submit-button-color: #FFFFFF;
      --error-button-background-color: #0F7A67;
      --error-button-border-color: #0C6154;
      --error-button-color: #FFFFFF;
    }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui,
        -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { letter-spacing: -0.015em; }
    a { color: #0F7A67; }
    a:hover { color: #0C6154; }

  introTitle: "Aidelly system status"
  introMessage: |
    Live status for Aidelly and for the social platforms we publish to.

    This page is hosted independently of Aidelly's own infrastructure, so it
    stays up when we do not.

    **Platform APIs** are shown so you can tell whether a publishing problem is
    ours or the network's. These checks detect outright outages and cannot see
    partial degradation, so a green platform is not a guarantee that every
    endpoint behind it is healthy.

    Checks run every five minutes. Service credits under the Agency SLA apply
    to **App and dashboard** and **Publishing** only.
  navbar:
    - title: Status
      href: /
    - title: Aidelly
      href: https://www.aidelly.ai
    - title: Security
      href: https://www.aidelly.ai/security
    - title: Contact
      href: https://www.aidelly.ai/contact

# Do not open an issue for a blip shorter than this.
skipDescriptionUpdate: false
commitMessages:
  readmeContent: "#template: Status summary in README. Do not edit manually."
  summaryContent: "#template: Status summary. Do not edit manually."
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms)"
